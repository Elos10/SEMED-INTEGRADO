<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15231f" />
    <meta name="description" content="Sistema escolar para criação, impressão e correção automática de avaliações por gabaritos OMR." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315231f'/%3E%3Cpath d='M18 17h28v30H18z' fill='%23fff'/%3E%3Ccircle cx='26' cy='27' r='4' fill='%231f5c47'/%3E%3Ccircle cx='38' cy='27' r='4' fill='%23dcebe3' stroke='%231f5c47' stroke-width='2'/%3E%3Ccircle cx='26' cy='39' r='4' fill='%23dcebe3' stroke='%231f5c47' stroke-width='2'/%3E%3Ccircle cx='38' cy='39' r='4' fill='%231f5c47'/%3E%3C/svg%3E" />
    <title>Avalia | Gabaritos escolares</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#f5f3ed;color:#15231f;font-family:Calibri,"Segoe UI",sans-serif}
      .initial-loader{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      .initial-loader__card{width:min(420px,100%);text-align:center}
      .initial-loader__logo{display:block;width:min(380px,90vw);height:auto;margin:0 auto 24px}
      .initial-loader h1{margin:0;font-size:28px}.initial-loader p{margin:8px 0 22px;color:#15231f99}
      .initial-loader__bar{height:4px;overflow:hidden;border-radius:10px;background:#dcebe3}
      .initial-loader__bar::after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#1f5c47;animation:loading 1.1s ease-in-out infinite alternate}
      @keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-loader" aria-live="polite" aria-label="Carregando sistema Avalia">
        <section class="initial-loader__card">
          <img class="initial-loader__logo" src="/logo_semed.webp" alt="Secretaria de Educação de Uberaba" />
          <h1>Sistema Avalia</h1>
          <p>Preparando o sistema de gabaritos escolares…</p>
          <div class="initial-loader__bar" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <noscript>Este sistema precisa do JavaScript habilitado para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
